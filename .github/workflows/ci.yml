name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Live check
        run: python live_check.py --once
      - name: Pytest
        run: pytest tests/ -v --cov=src --cov-report=term-missing

  build:
    name: Build EXE
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: PyInstaller
        run: pyinstaller --noconfirm installer\UltimateCommander.spec
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: UltimateCommanderOS-windows
          path: dist/UltimateCommanderOS

  release:
    name: Release
    runs-on: windows-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: UltimateCommanderOS-windows
          path: dist/UltimateCommanderOS
      - name: Zip
        run: Compress-Archive -Path dist/UltimateCommanderOS -DestinationPath UltimateCommanderOS-windows.zip
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: UltimateCommanderOS-windows.zip
          generate_release_notes: true
